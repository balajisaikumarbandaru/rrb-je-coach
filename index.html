<title>RRB JE CBT-1 Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a station-board header over a tabbed workspace; exams take the whole screen in a CBT-style two-pane (question | palette). */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface2:#f6f8fb; --ink:#14202e; --muted:#5a6a7c; --line:#d6dee8;
  --accent:#1d4f91; --accent-ink:#ffffff; --signal:#d9930f; --board:#132238; --board-ink:#f4f6f9;
  --ok:#1d8a4f; --bad:#c3372c; --mark:#6a3fb5; --nv:#c9d2dd; --warnbg:#fff5e0;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141c; --surface:#17202b; --surface2:#1d2734; --ink:#e5ecf4; --muted:#93a3b6; --line:#2b3847;
  --accent:#6fa2e6; --accent-ink:#0b1320; --signal:#f0b545; --board:#0a1220; --board-ink:#eef2f7;
  --ok:#3cc47b; --bad:#ee6a5f; --mark:#a98ae9; --nv:#3b4859; --warnbg:#2d2410; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141c; --surface:#17202b; --surface2:#1d2734; --ink:#e5ecf4; --muted:#93a3b6; --line:#2b3847;
  --accent:#6fa2e6; --accent-ink:#0b1320; --signal:#f0b545; --board:#0a1220; --board-ink:#eef2f7;
  --ok:#3cc47b; --bad:#ee6a5f; --mark:#a98ae9; --nv:#3b4859; --warnbg:#2d2410; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.board{background:var(--board);color:var(--board-ink)}
.board .wrap{padding-block:22px 0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,44px);line-height:1;margin:6px 0 8px;letter-spacing:.01em;text-wrap:balance}
.sub{color:color-mix(in srgb,var(--board-ink) 72%,transparent);max-width:62ch;margin:0 0 18px}
.pattern{display:flex;flex-wrap:wrap;gap:8px 22px;font-family:var(--f-mono);font-size:12px;padding-block:12px;border-top:1px solid color-mix(in srgb,var(--board-ink) 16%,transparent)}
.pattern b{color:var(--signal);font-weight:600}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;color:color-mix(in srgb,var(--board-ink) 70%,transparent);font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.03em;padding:10px 16px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--board-ink);border-bottom-color:var(--signal)}
main.wrap{padding-block:24px 60px;display:grid;gap:22px}
h2{font-family:var(--f-display);font-size:26px;font-weight:600;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:8px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.high{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.chip.medium{color:var(--signal);border-color:color-mix(in srgb,var(--signal) 45%,transparent)}
.chip.low,.chip.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{background:var(--warnbg);border:1px solid color-mix(in srgb,var(--signal) 40%,transparent);border-radius:8px;padding:12px 14px}

/* tracker */
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.track{grid-template-columns:1fr}}
.stop{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);display:grid;gap:6px;align-content:start;position:relative}
.stop.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.stop .n{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.stop .sc{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.rail{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rail i{display:block;height:100%;background:var(--signal)}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.bar{display:inline-block;width:80px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;margin-right:8px;overflow:hidden}
.bar i{display:block;height:100%}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px;align-content:start;min-width:0}
.card h3{line-height:1.15}
.empty{border:1px dashed var(--line);border-radius:8px;padding:22px;color:var(--muted);display:grid;gap:6px}
.empty b{color:var(--ink)}
code.say{font-family:var(--f-mono);font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--ink)}

/* module reader */
.reader{max-width:72ch;display:grid;gap:14px}
.reader p{margin:0}
.blk-h{font-family:var(--f-display);font-size:22px;font-weight:600;margin-top:8px}
.blk-formula{font-family:var(--f-mono);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:10px 14px;white-space:pre-wrap;overflow-x:auto}
.blk-trap{border-left:3px solid var(--bad);padding:8px 14px;background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.blk-tip{border-left:3px solid var(--ok);padding:8px 14px;background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.blk-example{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--surface)}
.blk-example ol{margin:6px 0 0;padding-left:20px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.reader ul{margin:0;padding-left:20px}

/* quick check / options */
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:10px 12px;width:100%}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);min-width:1.4em}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.qtext{font-size:16px;white-space:pre-wrap}

/* exam */
.exam{min-height:100%;display:grid;grid-template-rows:auto auto 1fr}
.xbar{background:var(--board);color:var(--board-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
.xbar .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.xtitle{font-family:var(--f-display);font-size:20px;font-weight:600}
.clock{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:6px;background:color-mix(in srgb,var(--board-ink) 10%,transparent)}
.clock.low{background:var(--bad);color:#fff}
.secs{background:var(--surface);border-bottom:1px solid var(--line)}
.secs .wrap{display:flex;gap:4px;overflow-x:auto;padding-block:6px}
.sec{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:5px;padding:6px 12px;font-size:13px;white-space:nowrap}
.sec[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.xbody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding-block:16px 30px;align-items:start}
@media (max-width:860px){.xbody{grid-template-columns:1fr}}
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:14px}
.qno{font-family:var(--f-display);font-size:22px;font-weight:600}
.xactions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.btn.save{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.markb{background:var(--mark);border-color:var(--mark);color:#fff}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin-bottom:12px}
.legend span{display:flex;align-items:center;gap:6px}
.pal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pq{position:relative;aspect-ratio:1.25;max-width:100%;border:0;border-radius:5px;font-family:var(--f-mono);font-weight:600;font-size:13px;background:var(--nv);color:var(--ink)}
.pq.na{background:var(--bad);color:#fff;border-radius:5px 5px 12px 12px}
.pq.an{background:var(--ok);color:#fff;border-radius:12px 12px 5px 5px}
.pq.mk{background:var(--mark);color:#fff;border-radius:50%}
.pq.am{background:var(--mark);color:#fff;border-radius:50%}
.pq.am::after{content:"";position:absolute;right:3px;bottom:3px;width:8px;height:8px;border-radius:50%;background:var(--ok);border:1px solid #fff}
.pq.cur{outline:3px solid var(--signal);outline-offset:1px}
.sw{width:18px;height:15px;display:inline-block}
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.dialog{background:var(--surface);border-radius:10px;padding:20px;max-width:520px;width:100%;display:grid;gap:14px;border:1px solid var(--line)}

/* result */
.scorebig{font-family:var(--f-mono);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.kpis{display:flex;flex-wrap:wrap;gap:22px}
.kpi .label{margin:0}
.rev{display:grid;gap:12px}
.revq{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface);display:grid;gap:10px}
.expl{background:var(--surface2);border-radius:6px;padding:10px 12px;white-space:pre-wrap}
@media (prefers-reduced-motion:no-preference){.rail i,.bar i{transition:width .5s ease}}

/* rough work: a paper sheet docked right (landscape) or bottom (portrait); one sheet per question */
:root{ --paper:#fbfaf4; --paper-grid:rgba(29,79,145,.10); --rough-w:min(620px,56vw) }
button,.opt,.pq{touch-action:manipulation}
.exam{-webkit-user-select:none;user-select:none}
.rough{position:fixed;z-index:15;top:0;right:0;bottom:0;width:var(--rough-w);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.rough-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.rough-bar .btn{padding:7px 12px}
.rough-bar .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line);padding:0}
.swatch.on{outline:3px solid var(--signal);outline-offset:1px}
.rough-pad{flex:1;position:relative;background-color:var(--paper);background-image:linear-gradient(var(--paper-grid) 1px,transparent 1px),linear-gradient(90deg,var(--paper-grid) 1px,transparent 1px);background-size:24px 24px;touch-action:none;overflow:hidden}
.rough-pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
body.rw .xbody{grid-template-columns:1fr;padding-right:calc(var(--rough-w) + 16px)}
body.rw .xbar .wrap,body.rw .secs .wrap{padding-right:calc(var(--rough-w) + 16px)}
@media (orientation:portrait),(max-width:760px){
  .rough{left:0;width:auto;top:auto;height:56vh;border-left:0;border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.12);padding-left:env(safe-area-inset-left,0px)}
  body.rw .xbody,body.rw .xbar .wrap,body.rw .secs .wrap{padding-right:max(16px,env(safe-area-inset-right,0px))}
  body.rw .xbody{padding-bottom:58vh}
}
@media (pointer:coarse){ .pq{min-height:40px} .opt{padding:14px} }
</style>

<div id="app"></div>

<script>
const SECTIONS = ["Mathematics","General Intelligence & Reasoning","General Awareness","General Science"];
const S = { db:null, ready:false, noDb:false, tests:[], modules:[], diags:[], attempts:[], profile:null, progress:{done:{}},
  tab:'plan', view:'home', exam:null, attemptView:null, moduleId:null, revFilter:'wrong', openDiag:null, qc:{}, confirm:false, saveErr:null,
  cardDocs:[], cardProg:{}, mem:{ filter:'all', attention:false, cur:null, flipped:false, cram:false, lastId:null, done:0 } };

/* ---------- helpers ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v==null || v===false) continue;
    if (k==='class') el.className = v;
    else if (k==='style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true ? '' : v);
  }
  for (const c of kids.flat(Infinity)){ if (c==null || c===false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
const lsGet = k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
const pct = (a,b) => b ? Math.round(a*100/b) : 0;
const fmt2 = x => (Math.round(x*100)/100).toFixed(2);
const mmss = ms => { const s = Math.max(0, Math.round(ms/1000)); const hh = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  return (hh ? hh+':'+String(m).padStart(2,'0') : String(m).padStart(2,'0')) + ':' + String(ss).padStart(2,'0'); };
const dateStr = t => t ? new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'}) : '';
const accColor = a => a >= 75 ? 'var(--ok)' : a >= 50 ? 'var(--signal)' : 'var(--bad)';
const L = 'ABCD';

/* ---------- data ---------- */
async function boot(){
  render();
  const db = window.claude ? await window.claude.use('db') : null;
  if (!db){ S.noDb = true; render(); return; }
  S.db = db;
  const sub = (col, key, sort) => db.collection(col).onSnapshot(s => {
    S[key] = s.docs.map(d => ({ id:d.id, ...d.data() })).sort(sort || (()=>0));
    S.ready = true; if (S.view !== 'exam') render();
  }, () => {});
  sub('tests','tests',(a,b)=>(b.createdAt||0)-(a.createdAt||0));
  sub('modules','modules',(a,b)=>(a.order??99)-(b.order??99));
  sub('diagnostics','diags',(a,b)=>(a.mock||0)-(b.mock||0));
  sub('attempts','attempts',(a,b)=>(b.submittedAt||0)-(a.submittedAt||0));
  sub('cards','cardDocs',(a,b)=>(a.createdAt||0)-(b.createdAt||0));
  db.doc('progress/cards').get().then(d => { S.cardProg = d.exists ? (d.data().cards || {}) : {}; S.mem.cur = null; if (S.view!=='exam') render(); }, () => {});
  db.doc('profile/weakness').onSnapshot(d => { S.profile = d.exists ? d.data() : null; if (S.view!=='exam') render(); }, () => {});
  db.doc('progress/modules').onSnapshot(d => { S.progress = d.exists ? d.data() : {done:{}}; if (S.view!=='exam') render(); }, () => {});
}

/* ---------- shell ---------- */
function render(){
  const app = document.getElementById('app');
  app.replaceChildren(S.view === 'exam' ? examView() : S.view === 'instr' ? shell(instrView()) : S.view === 'result' ? shell(resultView()) : S.view === 'module' ? shell(moduleView()) : shell(homeView()));
  if (S.view === 'exam'){ tickClock(); roughSync(); } else if (RW.open) toggleRough(false);
}

/* ---------- rough work (Apple Pencil, finger or mouse) ----------
   Strokes are stored per question as points normalised to the sheet width, so a rotated iPad redraws them in place. */
const RW = { open:false, tool:'pen', color:'#1b2a41', pencilOnly:true, sawPen:false, sheets:{}, testId:null, qid:null, el:null, cv:null, ctx:null, cur:null, dpr:1 };
const INKS = ['#1b2a41','#1d4f91','#c3372c'];
let rwSaveT = null;
function roughSaveSoon(){ clearTimeout(rwSaveT); rwSaveT = setTimeout(() => { if (RW.testId) lsSet('rough:'+RW.testId, RW.sheets); }, 700); }
function roughBuild(){
  if (RW.el) return;
  const tool = (k, label) => h('button',{class:'btn','data-tool':k,onclick:()=>{ RW.tool = k; roughBar(); }}, label);
  RW.el = h('aside',{class:'rough',hidden:true,'aria-label':'Rough work sheet'},
    h('div',{class:'rough-bar'},
      h('b',{id:'rough-title',style:'font-family:var(--f-display);font-size:18px'},'Rough work'),
      h('div',{class:'row'},
        tool('pen','Pen'), tool('erase','Eraser'),
        INKS.map(c => h('button',{class:'swatch','data-ink':c,style:`background:${c}`,'aria-label':'Ink colour',onclick:()=>{ RW.color = c; RW.tool = 'pen'; roughBar(); }})),
        h('button',{class:'btn',onclick:roughUndo},'Undo'),
        h('button',{class:'btn',onclick:roughClear},'Clear'),
        h('button',{class:'btn primary',onclick:()=>toggleRough(false)},'Close')),
      h('label',{class:'row small muted',style:'width:100%;cursor:pointer'},
        h('input',{type:'checkbox',id:'rw-pencil',checked:true,onchange:e=>{ RW.pencilOnly = e.target.checked; }}),
        'Palm rejection: once the Apple Pencil is used, ignore finger touches')),
    h('div',{class:'rough-pad'}, h('canvas',{id:'rough-cv'})));
  document.body.append(RW.el);
  RW.cv = RW.el.querySelector('canvas'); RW.ctx = RW.cv.getContext('2d');
  new ResizeObserver(roughResize).observe(RW.cv.parentElement);
  const cv = RW.cv;
  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen') RW.sawPen = true;
    if (RW.pencilOnly && RW.sawPen && e.pointerType === 'touch') return;
    e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch {}
    RW.cur = { id:e.pointerId, s:{ t:RW.tool, c:RW.color, p:[] } };
    roughPoint(e);
  });
  cv.addEventListener('pointermove', e => {
    if (!RW.cur || RW.cur.id !== e.pointerId) return;
    e.preventDefault();

        h('div',{class:'kpi'},h('div',{class:'label'},'Left'),h('div',{class:'scorebig muted'},a.skipped)),
        h('div',{class:'kpi'},h('div',{class:'label'},'Time used'),h('div',{class:'scorebig'},mmss(a.timeUsedMs)))),
      h('p',{class:'small muted',style:'margin:0'}, `Negative marking cost you ${fmt2(a.wrong/3)} marks. Accuracy on attempted questions: ${pct(a.correct,a.correct+a.wrong)}%.`)),
    h('section',{class:'panel tscroll',style:'padding:6px 8px'}, h('table',null,
      h('thead',null,h('tr',null,h('th',null,'Topic'),h('th',{class:'n'},'Right'),h('th',{class:'n'},'Wrong'),h('th',{class:'n'},'Left'),h('th',null,'Accuracy'),h('th',{class:'n'},'Avg time'))),
      h('tbody',null, topics.map(t => { const ac = pct(t.correct,t.total); return h('tr',null,
        h('td',null,h('div',null,t.topic),h('div',{class:'muted small'},short(t.section))),
        h('td',{class:'n'},t.correct),h('td',{class:'n'},t.wrong),h('td',{class:'n'},t.skipped),
        h('td',{class:'num',style:'white-space:nowrap'},h('span',{class:'bar'},h('i',{style:`width:${ac}%;background:${accColor(ac)}`})),ac+'%'),
        h('td',{class:'n'},Math.round(t.ms/t.total/1000)+'s')); })))),
    h('section',{class:'stack'},
      h('div',{class:'spread'}, h('h2',null,'Review'),
        h('div',{class:'row'}, [['wrong','Wrong'],['skipped','Left'],['all','All']].map(([k,t]) => h('button',{class:'btn'+(S.revFilter===k?' primary':''),onclick:()=>{ S.revFilter=k; render(); }},t)))),
      !test ? h('p',{class:'muted'},'The questions for this test are no longer stored.') :
      filt.length ? h('div',{class:'rev'}, filt.map(r => { const q = qById[r.qid]; if (!q) return null; const n = q.n || a.responses.indexOf(r)+1;
        return h('div',{class:'revq'},
          h('div',{class:'spread'}, h('b',null,`Q${n}`), h('span',{class:'row'}, h('span',{class:'chip'},q.topic), h('span',{class:'num muted small'},Math.round(r.ms/1000)+'s'))),
          h('div',{class:'qtext'}, isPyq(test) ? `Question No. ${q.n} in ${test.paperFile || 'the paper'}` : q.q),
          h('div',{class:'opts',style:isPyq(test)?'grid-template-columns:repeat(4,1fr)':null}, qOpts(test, q).map((o,j)=>h('div',{class:'opt'+(j===q.answer?' right':j===r.chosen?' wrong':'')},h('span',{class:'k'},L[j]),h('span',null,o,
            j===r.chosen ? h('span',{class:'muted small'}, isPyq(test) ? ' you' : '  · your answer') : null)))),
          q.explanation ? h('div',{class:'expl small'},q.explanation) : null); }))
        : h('p',{class:'muted'}, S.revFilter==='wrong' ? 'No wrong answers in this attempt.' : 'Nothing here.')));
}

const pending = lsGet('cbt:pending');
boot().then(() => { if (pending && S.db) saveAttempt(pending); });
